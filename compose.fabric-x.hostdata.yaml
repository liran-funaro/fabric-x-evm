#
# HOST DATA OVERRIDE (opt-in): rebinds the committer + orderer named volumes
# declared in compose.fabric-x.full.yaml to ./data on the host, so persisted
# state can be inspected from the host after a run. This routes every ledger/DB
# write back through colima's sshfs mount, which caps throughput -- use it only
# to investigate data, NOT for performance runs.
#
# Enabled by `make start-full HOST_DATA=1` (and stop-full/perf equivalents),
# which overlays this file and exports DATA_ROOT=<repo>/data (absolute path
# required by the local bind driver). Service definitions are untouched here:
# only the backing of each already-declared named volume changes.
---
volumes:
  orderer-party1-router:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT:-./data}/orderers/party1-router
  orderer-party1-batcher:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT:-./data}/orderers/party1-batcher
  orderer-party1-consenter:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT:-./data}/orderers/party1-consenter
  orderer-party1-assembler:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_ROOT:-./data}/orderers/party1-assembler
  orderer-party2-router:
