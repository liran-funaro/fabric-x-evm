---
server:
  endpoint: :7001
  # The endorser's warm pass fires a whole batch's state reads concurrently as
  # individual GetRows/GetCode/GetBalance RPCs, so a single gateway approaches the
  # query-service default cap of 5000 unary req/s (burst 1000) at sustained load.
  # Disable it for benchmarking so the measured ceiling is the real system, not this
  # DoS-protection default. 0 removes the limiter entirely (start_serve.go only wires
  # it when requests-per-second > 0).
  # NOTE: in the colima/QEMU/sshfs dev stack this is NOT the binding ceiling — the
  # throughput wall at ~35k txs / ~550 orderer blocks is the sshfs mount wedging under
  # the arma orderer's block-ledger appends (append latency cliffs 34ms -> 11s at
  # block ~554), which surfaces at the gateway as endorse-read DeadlineExceeded.
  # Disabling this had no effect on that wall; it matters on faster (non-sshfs) hosts.
  rate-limit:
    requests-per-second: 0
    burst: 0
  tls:
    mode: mtls
    cert-path: /node-tls/server.crt
    key-path: /node-tls/server.key
    ca-cert-paths:
      - /org-tls-ca.pem
monitoring:
  endpoint: :2117
  tls:
    mode: none

database:
  endpoints:
    - committer-db:5432
  username: "sc_user"
  password: "sc_secret_pwd"
  database: "sc_db"
  tls:
    mode: none
  max-connections: 10
  min-connections: 5
  load-balance: false
  retry:
    initial-interval: 500ms
    randomization-factor: 0.5
    multiplier: 1.5
    max-interval: 60s
    max-elapsed-time: 15m

# A single gateway drives all reads through one view: its warm pass fires a whole
# batch's reads concurrently (concurrency = batch size), so a wave arrives at the
# server within microseconds. Flush that wave immediately on key-count, and cap the
# tail wait low, instead of the bulk-read default (1024 keys / 100ms) that never
# fills from one client and leaves ~100ms exposed on every small wave.
min-batch-keys: 32
max-batch-wait: 2ms
view-aggregation-window: 100ms
max-aggregated-views: 1024
max-view-timeout: 10s
max-active-views: 4096
max-request-keys: 10000

logging:
  logSpec: info:grpc=error
